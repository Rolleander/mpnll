dependencies {
  api(project(':client')) {
    exclude group: 'com.google.protobuf', module: 'protobuf-java'
  }
  api libs.protobuf.gwt
  implementation libs.gwt.dev
  implementation libs.gwt.user
  testImplementation libs.junit
}

tasks.named('jar') {
  from sourceSets.main.allJava
  from('src/main/super')
  from('src/main/java') {
    include '**/*.gwt.xml'
  }
}

sourceSets {
  test {
    java.srcDir 'src/test-gwt/java'
  }
}

def gwtSmokeSource = file('src/test-gwt/java')
def gwtSuperSource = file('src/main/super')
def gwtSmokeWar = layout.buildDirectory.dir('gwt-smoke')
def clientSource = project(':client').file('src/main/java')

tasks.register('gwtCompileSmoke', JavaExec) {
  group = 'verification'
  description = 'Compiles the browser WebSocket smoke test with the real GWT compiler.'
  dependsOn classes
  mainClass = 'com.google.gwt.dev.Compiler'
  classpath = files(gwtSmokeSource, gwtSuperSource, sourceSets.main.java.srcDirs, clientSource) + sourceSets.main.runtimeClasspath
  args '-war', gwtSmokeWar.get().asFile.absolutePath,
    '-style', 'PRETTY',
    '-draftCompile',
    '-strict',
    'com.broll.mpnll.gwt.smoke.SmokeTest'
}

tasks.named('check') {
  dependsOn gwtCompileSmoke
}

tasks.register('gwtSmoke', Exec) {
  group = 'verification'
  description = 'Compiles and serves the GWT browser smoke test at http://localhost:8888/smoke/.'
  dependsOn gwtCompileSmoke
  commandLine 'python3', '-m', 'http.server', '8888',
    '--directory', gwtSmokeWar.get().asFile.absolutePath
  doFirst {
    logger.lifecycle('GWT smoke test: http://localhost:8888/smoke/')
    logger.lifecycle('Start :server:start in another terminal; the page runs the test automatically.')
  }
}

tasks.register('gwtSanity') {
  group = 'verification'
  description = 'Compiles the auto-running GWT lobby-list sanity page.'
  dependsOn gwtCompileSmoke
}
