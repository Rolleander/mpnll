buildscript {
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'java-library'

  group = 'com.broll.mpnll'
  version = projectVersion

  java.sourceCompatibility = 8
  java.targetCompatibility = 8
}

configure(subprojects) {
  apply plugin: 'java-library'
  sourceCompatibility = 8
  compileJava {
    options.encoding = 'UTF-8'
    options.incremental = true
  }
  compileTestJava {
    options.encoding = 'UTF-8'
  }
}

subprojects {
  ext.appName = 'mpnll'

  if (name != 'protocol-gradle-plugin') {
    dependencies {
      implementation libs.log4j
    }
  }
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }
}

def publishedLibraries = [
    project(':shared'),
    project(':server'),
    project(':client'),
    project(':client-gwt'),
    project(':client-java')
]
def publishedProjects = publishedLibraries + project(':protocol-gradle-plugin')

configure(publishedLibraries) {
  apply plugin: 'maven-publish'

  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java
        artifactId = project.name
      }
    }
  }
}

tasks.register('publishAllToMavenLocal') {
  group = 'publishing'
  description = 'Publishes all MPNLL artifacts to the local Maven repository.'
  dependsOn publishedProjects.collect { it.tasks.named('publishToMavenLocal') }
}

tasks.register('publishAll') {
  group = 'publishing'
  description = 'Publishes all MPNLL artifacts to the local Maven repository.'
  dependsOn tasks.named('publishAllToMavenLocal')
}
